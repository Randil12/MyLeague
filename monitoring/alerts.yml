groups:
  - name: vps
    rules:
      - alert: VPSExporterDown
        expr: up{job="vps"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Collecteur du VPS inaccessible"}
      - alert: VPSHighCPU
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="vps",mode="idle"}[5m]))) > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "CPU VPS au-dessus de 90 % pendant 10 minutes"}
      - alert: VPSLowMemory
        expr: 100 * node_memory_MemAvailable_bytes{job="vps"} / node_memory_MemTotal_bytes{job="vps"} < 10
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Moins de 10 % de RAM disponible"}
      - alert: VPSLowDisk
        expr: (100 * node_filesystem_avail_bytes{job="vps",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="vps",fstype!~"tmpfs|overlay|squashfs"} < 15) and on(instance,device,mountpoint) (node_filesystem_readonly{job="vps"} == 0)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Moins de 15 % de disque disponible"}
