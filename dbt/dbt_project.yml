name: myleague
version: "1.0.0"
profile: myleague
require-dbt-version: [">=1.9.0", "<1.10.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  myleague:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    gold:
      +materialized: table
      +schema: gold
