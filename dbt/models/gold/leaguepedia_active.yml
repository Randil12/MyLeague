version: 2
models:
  - name: gold_pro_player_games
    description: "Participations compétitives observées, identité Leaguepedia Link (pas PUUID)."
    columns:
      - name: game_id
        tests: [not_null]
      - name: player_page
        tests: [not_null]
      - name: season_year
        tests: [not_null]
      - name: equipment_fields_collected
        description: "Tous les champs d'équipement existent dans le JSON ; ils peuvent néanmoins être vides à la source."
        tests: [not_null]
  - name: gold_pro_active_players_year
    description: "Au moins une partie observée dans l'année ; aucune garantie de contrat professionnel."
    columns:
      - name: player_page
        tests: [not_null]
      - name: games
        tests: [not_null]
  - name: gold_pro_player_comparison
    description: "Comparaison par année, joueur, patch source, rôle et champion ; échantillon explicite."
    columns:
      - name: player_page
        tests: [not_null]
