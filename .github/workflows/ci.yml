name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint (ruff) + tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check jobs tests airflow/dags app

      - name: Pytest (tests unitaires)
        run: pytest -q

  dbt-validate:
    name: Validation du projet dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-postgres==1.9.0

      - name: dbt parse (valide modèles, macros et configs sans connexion)
        run: dbt parse --no-partial-parse --project-dir dbt --profiles-dir dbt/profiles
        env:
          GOLD_POSTGRES_HOST: localhost

  compose-validate:
    name: Validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration Compose
        run: docker compose config --quiet
